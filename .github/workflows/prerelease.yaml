name: Feature Branch Prerelease

on:
  pull_request:
    types: [labeled]
  push:
    branches:
      - 'feature/**'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # Check if PR has prerelease label (for push events)
  check-label:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    outputs:
      has-label: ${{ steps.check.outputs.has-label }}
    steps:
      - name: Check if PR has prerelease label
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = context.ref.replace('refs/heads/', '');

            // Find open PR for this branch
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${branchName}`
            });

            if (prs.length === 0) {
              core.setOutput('has-label', 'false');
              return;
            }

            // Check if PR has 'prerelease' label
            const hasLabel = prs[0].labels.some(label => label.name === 'prerelease');
            core.setOutput('has-label', hasLabel.toString());

  prerelease:
    # Only run when:
    # 1. 'prerelease' label is added to PR, OR
    # 2. Push to feature branch AND PR has 'prerelease' label
    if: |
      always() &&
      (
        (github.event_name == 'pull_request' &&
         github.event.label.name == 'prerelease' &&
         startsWith(github.event.pull_request.head.ref, 'feature/')) ||
        (github.event_name == 'push' &&
         needs.check-label.result == 'success' &&
         needs.check-label.outputs.has-label == 'true')
      )
    needs: [check-label]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: npm run release

      - name: Comment on PR with prerelease info
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Get branch name
            const branchName = context.eventName === 'pull_request'
              ? context.payload.pull_request.head.ref
              : context.ref.replace('refs/heads/', '');

            let comment = '## 🚀 Prerelease Created\n\n';
            comment += `**Branch:** \`${branchName}\`\n\n`;
            comment += '### Versions:\n\n';

            // Read package versions
            try {
              const packageA = JSON.parse(fs.readFileSync('package-a/package.json', 'utf8'));
              const packageB = JSON.parse(fs.readFileSync('package-b/package.json', 'utf8'));

              comment += `- **package-a:** \`${packageA.version}\`\n`;
              comment += `- **package-b:** \`${packageB.version}\`\n\n`;

              comment += '### Install in your app:\n\n';
              comment += '```bash\n';
              comment += `npm install github:glushkova91/release-please-prerelease-example#@release-please-example/package-a@${packageA.version}\n`;
              comment += `npm install github:glushkova91/release-please-prerelease-example#@release-please-example/package-b@${packageB.version}\n`;
              comment += '```\n';
            } catch (error) {
              comment += '\n⚠️ Could not read package versions. Check workflow logs.\n';
            }

            // Find open PR for this branch (for push events)
            if (context.eventName === 'push') {
              const { data: prs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${context.repo.owner}:${branchName}`
              });

              if (prs.length > 0) {
                await github.rest.issues.createComment({
                  issue_number: prs[0].number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: comment
                });
              }
            } else {
              // For pull_request events
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }